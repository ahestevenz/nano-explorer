# Minimal SLAM configuration
# Requires the ORB-SLAM2 Python bindings from github.com/jskinn/ORB_SLAM2-PythonBindings
backend: orbslam2

# ORB-SLAM2: path to the ORB vocabulary file
# Download from: https://github.com/raulmur/ORB_SLAM2/tree/master/Vocabulary
vocabulary: assets/models/ORBvoc.txt

# ORB-SLAM2 camera calibration YAML (OpenCV FileStorage format)
# Calibrate your camera and update config/models/orbslam2_mono.yaml
settings: config/models/orbslam2_mono.yaml

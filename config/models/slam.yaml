# Minimal SLAM configuration
# Requires the ORB-SLAM2 Python bindings from github.com/ahestevenz/ORB_SLAM2-PythonBindings
# (backend: orbslam2) or the ORB-SLAM3 bindings from github.com/ahestevenz/pyorbslam
# (backend: orbslam3).
#
# The vocabulary path and camera-calibration settings live in the backend's own
# settings file (config/models/orbslam2_mono.yaml or orbslam3_mono.yaml) — see
# the "Vocabulary" key there. Nothing else to configure here.
backend: orbslam2

%YAML:1.0
---
# Camera calibration — IMX219 CSI on Waveshare JetBot (Jetson Nano 4GB)
# Resolution: 640x480
# WARNING: these are approximate values. Run camera calibration (e.g. with
# OpenCV's calibrateCamera) and replace fx, fy, cx, cy, k1, k2, p1, p2.
#
# This is ORB-SLAM3's legacy (no File.version key) settings format — the same
# field set as orbslam2_mono.yaml, plus Camera.type (required: Tracking::
# ParseCamParamFile in ORB-SLAM3's Tracking.cc only enters its Pinhole parsing
# branch when this is exactly "PinHole") and Camera.width/height (not read by
# the C++ core in this path, but required by pyorbslam's own high-level
# ASLAM/MonoSLAM wrapper, which reads them directly from this YAML).

# Path to the ORB vocabulary file, relative to the project root (or absolute).
# Download from: https://github.com/raulmur/ORB_SLAM2/tree/master/Vocabulary
Vocabulary: "assets/models/ORBvoc.txt"

# How long (s) tracking keeps trying to relocalize in the current map after it's
# lost, before ORB-SLAM3 stores that map and starts a new, unconnected one.
# Upstream hard-codes 3 s. Needs the nano-explorer pyorbslam fork; older builds
# ignore it (always 3 s), and nano-explorer logs a warning if it differs.
System.RecentlyLostSeconds: 8.0

Camera.type: "PinHole"

Camera.fx: 530.067336
Camera.fy: 707.509521
Camera.cx: 305.709515
Camera.cy: 274.720308

Camera.k1: -0.364345
Camera.k2: 0.212120
Camera.p1: -0.000883
Camera.p2: 0.000625

Camera.width: 640
Camera.height: 480
Camera.fps: 30.0

# 0: BGR (OpenCV default from CSI pipeline), 1: RGB
Camera.RGB: 0

# ORB feature extractor
# 1000 is ORB-SLAM's own default for 640x480. Monocular init uses a separate
# extractor with 5x this many features (Tracking.cc), so 2000 meant 10000
# features/frame until init — ~3 fps on the Nano's CPU.
ORBextractor.nFeatures: 1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# Viewer (unused — set_use_viewer(False) in slam.py)
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
